name: League runner

# Alpha Bazaar's AI Stock-Picking League: the open-weight models, run with llama.cpp on GitHub's free CPU runners
# (4 vCPU, 16 GB for a public repository). One job per model, each on its own runner, so a model that can't run
# (gpt-oss-20b's 12.1 GB may not fit) never holds up the others. Every file is pinned and its sha256 checked: the
# llama.cpp release and each GGUF (models.json). No secrets: the API checks this workflow's OIDC token (id-token:
# write), and nothing here prints a prompt (they carry licensed headlines) or a model's reply; the logs show job ids,
# models, timings and the decisions' fields.
#
# Each weekday the League's runner bots play at 6:33-6:45 PM ET and their jobs close by 7:15 PM ET. Cron is UTC:
# 21:07 is 5:07 PM in daylight time (4:07 PM in standard time), 22:07 is 5:07 PM in standard time (6:07 PM in daylight
# time), so a run is up from about 5 PM ET in either season, well before the jobs come; the others are backups, since
# GitHub can start a scheduled run late or skip it at busy times. The concurrency group keeps one run at a time; a run
# that starts after the hard stop (7:20 PM ET), or finds every model's job done in today's record, does nothing.
# GitHub registers the schedule when this file changes on main.

on:
  schedule:
    - cron: "7 21 * * 1-5"
    - cron: "37 21 * * 1-5"
    - cron: "7 22 * * 1-5"
  workflow_dispatch:
    inputs:
      heartbeat_only:
        description: "Only download, self-test and send a heartbeat (answers no job)"
        type: boolean
        default: false
      models:
        description: "Comma-separated model ids from models.json (default: every enabled model)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: league-runner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      skip: ${{ steps.plan.outputs.skip }}
      day: ${{ steps.plan.outputs.day }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Which models run
        id: plan
        env:
          MODELS: ${{ inputs.models }}
          HEARTBEAT_ONLY: ${{ inputs.heartbeat_only && 'true' || 'false' }}
        run: |
          flag=""
          if [ "$HEARTBEAT_ONLY" = "true" ]; then flag="--heartbeat-only"; fi
          python3 runner/league_runner.py plan --models "$MODELS" $flag >> "$GITHUB_OUTPUT"

  serve:
    name: ${{ matrix.model }}
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write  # the OIDC token the League's API checks: the runner's only credential
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MODEL: ${{ matrix.model }}
      HEARTBEAT_ONLY: ${{ inputs.heartbeat_only && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pinned files
        id: spec
        run: python3 runner/league_runner.py spec --model "$MODEL" >> "$GITHUB_OUTPUT"

      - name: A disk with room for the GGUF
        id: disk
        env:
          SIZE: ${{ steps.spec.outputs.size }}
        run: |
          need=$((SIZE + 2 * 1024 * 1024 * 1024))
          for dir in /mnt/league "$RUNNER_TEMP/league"; do
            sudo mkdir -p "$dir" && sudo chown "$(id -u):$(id -g)" "$dir" || continue
            avail=$(df --output=avail -B1 "$dir" | tail -n 1)
            if [ "$avail" -ge "$need" ]; then
              echo "dir=$dir" >> "$GITHUB_OUTPUT"
              echo "Using $dir: $((avail / 1024 / 1024 / 1024)) GiB free"
              exit 0
            fi
          done
          echo "::error::No disk has room for the GGUF"
          exit 1

      - name: llama.cpp (the pinned CPU release, sha256 checked)
        env:
          DIR: ${{ steps.disk.outputs.dir }}
          URL: ${{ steps.spec.outputs.llama_url }}
          SHA256: ${{ steps.spec.outputs.llama_sha256 }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$DIR/llama.tar.gz" "$URL"
          echo "$SHA256  $DIR/llama.tar.gz" | sha256sum -c -
          mkdir -p "$DIR/llama"
          tar -xzf "$DIR/llama.tar.gz" -C "$DIR/llama" --strip-components=1
          test -x "$DIR/llama/llama-server"

      - name: The GGUF (anonymous download at the pinned revision, sha256 checked)
        env:
          DIR: ${{ steps.disk.outputs.dir }}
          URL: ${{ steps.spec.outputs.url }}
          FILE: ${{ steps.spec.outputs.file }}
          SHA256: ${{ steps.spec.outputs.sha256 }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -C - -o "$DIR/$FILE" "$URL"
          echo "$SHA256  $DIR/$FILE" | sha256sum -c -

      - name: Start llama-server
        env:
          DIR: ${{ steps.disk.outputs.dir }}
          FILE: ${{ steps.spec.outputs.file }}
          CTX: ${{ steps.spec.outputs.ctx }}
          SERVER_ARGS: ${{ steps.spec.outputs.server_args }}
        run: |
          # $SERVER_ARGS is unquoted on purpose (one word per flag); league_runner.py checks each against a pattern
          LD_LIBRARY_PATH="$DIR/llama" nohup "$DIR/llama/llama-server" -m "$DIR/$FILE" --alias "$MODEL" \
            --host 127.0.0.1 --port 8080 -c "$CTX" --parallel 1 --jinja $SERVER_ARGS \
            > "$DIR/llama-server.log" 2>&1 &
          echo "llama-server started (its log stays on this machine; it is shown only if the model never gets going)"

      - name: Self-test, heartbeat, then today's jobs
        env:
          DIR: ${{ steps.disk.outputs.dir }}
        run: |
          flag=""
          if [ "$HEARTBEAT_ONLY" = "true" ]; then flag="--heartbeat-only"; fi
          python3 runner/league_runner.py serve --model "$MODEL" --server http://127.0.0.1:8080 \
            --server-log "$DIR/llama-server.log" --record "record/$MODEL.json" $flag

      - name: Keep the run's record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: record-${{ matrix.model }}
          path: record/
          if-no-files-found: ignore
          retention-days: 7

  record:
    needs: [plan, serve]
    if: always() && needs.plan.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the day's run record, committed to runs/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: The models' records
        continue-on-error: true  # no record at all (every job failed early) still records the run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: record-*
          path: record
          merge-multiple: true

      - name: Today's record
        env:
          DAY: ${{ needs.plan.outputs.day }}
        run: python3 runner/league_runner.py record --day "$DAY" --records record --runs runs

      - name: Commit it
        env:
          DAY: ${{ needs.plan.outputs.day }}
        run: |
          git config user.name "Alpha Bazaar"
          git config user.email "support@alphabazaar.ai"
          git add runs
          if git diff --cached --quiet; then
            echo "Nothing new to record"
            exit 0
          fi
          git commit -q -m "Run record $DAY (run $GITHUB_RUN_ID)"
          for attempt in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
